[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ntg"
version = "1.0.0"
description = "Architecture-Aware AI Coding Agent & Multi-Provider LiteLLM Smart Router"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.90.0,<=1.98.0",
    "google-genai>=0.1.0",
    "requests>=2.28.0",
]

[project.scripts]
ntg = "ntg.cli.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ntg*"]
